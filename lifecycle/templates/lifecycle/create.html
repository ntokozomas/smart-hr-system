{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Create Onboarding Record</h2>

    <div class="card">
        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Onboarding
                </button>

                <a href="{% url 'lifecycle:home' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
