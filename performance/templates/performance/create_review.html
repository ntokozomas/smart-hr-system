{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="card">
        <div class="card-header">
            <h2>Create Performance Review</h2>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Review
                </button>

                <a href="{% url 'performance:home' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>

</div>
{% endblock %}
