{% comment %}Alert banner (4.7.4): success, warning, error and info messages.
In a view: messages.success(request, "Your leave request was submitted and is waiting for approval."){% endcomment %}
{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="{% if message.level >= 40 %}alert{% else %}status{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
